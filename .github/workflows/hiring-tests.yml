name: Hiring bot tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-hiring.lock
      - run: pip install -r requirements-hiring-test.lock
      - run: pip check
      - run: python tools/data_api/validate_data_api.py DATA-API.yaml
      - run: python scripts/release_check.py
      - run: python -m pytest hiring_tests -q
      - run: docker build -t rezumit-hiring:test .
        timeout-minutes: 5
      - run: docker build --target polling -t rezumit-polling:test .
        timeout-minutes: 5
      - name: Container start and restart smoke
        shell: bash
        run: |
          docker run -d --name hiring-smoke --init --read-only --tmpfs /tmp:rw,size=64m --cap-drop ALL --security-opt no-new-privileges -e HIRING_DEMO=false -e HIRING_EMPLOYER_CODE=synthetic-ci-code -e HIRING_SECRET=synthetic-ci-secret-not-for-deployment-123 -v hiring-smoke-data:/app/data rezumit-hiring:test
          docker exec hiring-smoke python scripts/smoke_hiring.py --wait
          docker restart hiring-smoke
          docker exec hiring-smoke python scripts/smoke_hiring.py --wait --verify-existing
      - name: Validate HTTPS proxy configuration
        run: docker run --rm -e PUBLIC_HOST=api.example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Clean smoke container
        if: always()
        run: docker rm -f hiring-smoke || true
