name: rezumit-hiring
services:
  api:
    build:
      context: .
      target: api
    # Bot credentials are supplied only at runtime, never copied into the image.
    env_file: .env.hiring
    environment:
      HIRING_DATABASE_URL: sqlite:////app/data/hiring.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hiring-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 25s
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  hiring-data:
